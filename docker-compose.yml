services:
  lab-turnaround-analyzer:
    build: .
    container_name: lab-turnaround-analyzer
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
