name: Python and browser regression tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify package and source compilation
        run: |
          python -m pip check
          python -m compileall -q agents cli.py tat_analyzer.py tat_metrics.py enrichment.py simulator.py
          python -c "from tat_metrics import analyze_csv; from cli import main"
      - name: Unit and regression tests
        run: python -m pytest -q

  browser:
    name: Static browser logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Browser-side calculation tests
        run: node --test web/app.test.js
      - name: Confirm static entrypoint and local assets
        run: |
          test -s web/index.html
          test -s web/app.js
          grep -q 'src="./app.js"' web/index.html
